<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portafolio de Alexander Watson en formato de terminal Linux: soporte TI, redes y ciberseguridad.">
<title>alexander@awportfolio: ~</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css?v=6">
</head>
<body>

<audio data-sfx="reveal" preload="auto"></audio>
<audio data-sfx="click"  preload="auto"></audio>

<main class="term-window">
    <div class="term-titlebar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <p class="term-title">alexander@awportfolio: ~</p>
    </div>

    <div class="term-body" id="term-body">
        <div id="boot"></div>

        <div id="dashboard" class="dashboard hidden">
            <div class="hero-card" id="hero-card"></div>
            <div class="card-grid" id="card-grid"></div>
        </div>
    </div>

    <!-- Navegación por clic: salta a cada tarjeta, sin escribir nada -->
    <nav class="quick-bar hidden" id="quick-bar" aria-label="Navegación rápida">
        <button type="button" data-action="about">about</button>
        <button type="button" data-action="skills">skills</button>
        <button type="button" data-action="certifications">certifications</button>
        <button type="button" data-action="projects">projects</button>
        <button type="button" data-action="contact">contact</button>
        <button type="button" data-action="resume">resume</button>
        <button type="button" data-action="reboot">reiniciar</button>
    </nav>
</main>

<script src="scripts/main.js?v=6"></script>
</body>
</html>
